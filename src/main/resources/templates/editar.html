<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente | Admin</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div class="login-card">
        <div class="brand-logo">✎ EDITAR</div>
        <span class="brand-sub">Modificar Cliente</span>
        <hr class="divider">

        <p th:if="${error}" th:text="${error}"
           style="color:#e74c3c; font-size:0.8rem; margin-bottom:10px;
                  background:rgba(231,76,60,0.1); padding:8px; border-radius:6px;">
        </p>

        <form th:action="@{/clientes/editar/{id}(id=${cliente.id})}" method="post">
            <div class="input-group-custom">
                <label>Nombre</label>
                <input type="text" name="nombre" class="form-control" th:value="${cliente.nombre}" required>
            </div>
            <div class="input-group-custom">
                <label>Email</label>
                <input type="email" name="email" class="form-control" th:value="${cliente.email}" required>
            </div>
            <div class="input-group-custom">
                <label>Teléfono</label>
                <input type="tel" name="telefono" class="form-control" th:value="${cliente.telefono}" required>
            </div>
            <button type="submit" class="btn-login">Guardar Cambios</button>
        </form>

        <a th:href="@{/clientes}" class="back-link" style="display:block; margin-top:20px;">← Volver a clientes</a>
    </div>
</body>
</html>

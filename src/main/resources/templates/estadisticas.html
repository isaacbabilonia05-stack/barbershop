<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estadísticas | Admin</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(212,175,55,0.1);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-number {
            font-size: 2rem;
            color: #d4af37;
            font-weight: bold;
        }
        .stat-label {
            color: #888;
            font-size: 0.8rem;
            margin-top: 5px;
        }
        .section-title {
            color: #d4af37;
            margin: 20px 0 10px 0;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="login-card panel-wide">
        <h1 class="page-title">📊 ESTADÍSTICAS</h1>
        <span class="subtitle">Panel Administrador</span>
        <div th:replace="~{fragments :: adminNav('estadisticas')}"></div>
        <div th:replace="~{fragments :: mensajes}"></div>
        <hr class="divider">

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" th:text="${totalClientes}">0</div>
                <div class="stat-label">Total Clientes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">
                    $ <span th:text="${#numbers.formatDecimal(ingresosTotales, 1, 2, 'COMMA')}"></span>
                </div>
                <div class="stat-label">Ingresos Totales</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" th:text="${#numbers.formatDecimal(calificacionPromedio, 1, 1)}">0</div>
                <div class="stat-label">⭐ Calificación Promedio</div>
            </div>
        </div>

        <h3 class="section-title">📋 Estado de Citas</h3>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" th:text="${citasPendientes}">0</div>
                <div class="stat-label">Pendientes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" th:text="${citasAceptadas}">0</div>
                <div class="stat-label">Aceptadas</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" th:text="${citasCompletadas}">0</div>
                <div class="stat-label">Completadas</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" th:text="${citasCanceladas}">0</div>
                <div class="stat-label">Canceladas</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" th:text="${citasRechazadas}">0</div>
                <div class="stat-label">Rechazadas</div>
            </div>
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <a th:href="@{/clientes}" class="btn-nuevo">← Gestionar Clientes</a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Servicios | Admin</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div class="login-card panel-wide">
        <h1 class="page-title">💈 SERVICIOS</h1>
        <span class="subtitle">Panel de administracion</span>
        <div th:replace="~{fragments :: adminNav('servicios')}"></div>
        <hr class="divider">
        <div th:replace="~{fragments :: mensajes}"></div>

        <table class="custom-table">
            <thead><tr><th>Nombre</th><th>Tipo</th><th>Precio</th><th>Duración</th><th>Acciones</th></tr></thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(servicios)}">
                    <td colspan="5" style="text-align:center; color:#d4af37; padding:30px;">📭 No hay servicios registrados.</td>
                </tr>
                <tr th:each="s : ${servicios}">
                    <td th:text="${s.nombre}"></td>
                    <td th:text="${s.tipo}"></td>
                    <td>$<span th:text="${#numbers.formatDecimal(s.precio, 0, 'POINT', 0, 'COMMA')}"></span></td>
                    <td><span th:text="${s.duracionMinutos}"></span> min</td>
                    <td>
                        <a th:href="@{/admin/servicios/editar/{id}(id=${s.id})}" class="btn-accion btn-editar">Editar</a>
                        <form th:action="@{/admin/servicios/eliminar/{id}(id=${s.id})}" method="post" class="inline"
                              onsubmit="return confirm('¿Eliminar este servicio?')">
                            <button type="submit" class="btn-accion btn-eliminar">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <a th:href="@{/admin/servicios/nuevo}" class="btn-nuevo">+ Nuevo Servicio</a>
    </div>
</body>
</html>

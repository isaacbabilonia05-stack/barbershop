spring.mongodb.uri=${SPRING_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Si usas Mongo Atlas, reemplaza la uri por algo asi:
# spring.mongodb.uri=mongodb+srv://usuario:clave@cluster0.xxxxx.mongodb.net/barberia_db?retryWrites=true&w=majority

# Ver las consultas que lanza Spring Data (equivalente al show-sql de JPA)
# Desactivado: con miles de registros imprime cada consulta y hace todo muy lento
#logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Encripta una sola vez las contrasenas que esten en texto plano al arrancar
app.encriptar-passwords-existentes=true

# ===== Seguridad =====
# Administrador inicial (se crea en la coleccion "administradores" solo si esta vacia; la clave se guarda con BCrypt).
app.admin.email=admin@barbershop.com
# app.admin.password  -> se define por variable de entorno (o en secrets.properties para uso local)
app.admin.nombre=Administrador

# ===== Sesiones =====
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=JSESSIONID

# ===== Errores =====
# No mostrar stack traces ni mensajes internos al usuario
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false

# ===== JWT (JSON Web Token) =====
# Clave secreta para firmar los tokens (HS256). Debe tener al menos 32 caracteres.
# app.jwt.secret  -> se define por variable de entorno (o en secrets.properties para uso local)
# Vida del token en minutos (igual que la sesion: 15)
app.jwt.expiracion-minutos=15

# ===== Google OAuth2 =====
# spring.security.oauth2.client.registration.google.client-id  -> se define por variable de entorno (o en secrets.properties para uso local)
# spring.security.oauth2.client.registration.google.client-secret  -> se define por variable de entorno (o en secrets.properties para uso local)
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# ===== Datos de prueba =====
# Seeder desactivado: los 22000 clientes fake ya estan guardados en la base de datos.
#app.seed-clientes-fake=22000
#app.seed-clientes-fake.password=Fake1234

# ===== Despliegue =====
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.config.import=optional:file:./secrets.properties
